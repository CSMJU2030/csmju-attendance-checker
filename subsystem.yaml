# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json
# ห้ามใส่บัญชีหรือรหัสผ่านในไฟล์นี้ — บัญชีทดสอบอยู่ในไฟล์นอก repo ที่ CONFORMANCE_ACCOUNTS_FILE ชี้
# (standards/docs/conformance.md ข้อ 2.1)

name: csmju-attendance-checker          # ตรงกับทะเบียนใน Core Hub, SUBSYSTEM_ID และ data.service ของ /api/health
# เวอร์ชัน standards อยู่ใน .standards-version ไฟล์เดียว
conformance_level: L3                 # ระบบที่มี UI ต้องถึง L3

# frontend เป็นประตูเดียวของระบบ: proxy /api/* และ /auth/login /auth/callback /auth/logout ไป backend
# พอร์ตที่ผู้ดูแล dev server กำหนดให้ทีม: frontend 5001 (รายชื่อพอร์ตของ PM) · backend 4202
base_url: http://localhost:5001
core_hub_url: https://csmju2030.jowave.com       # Core Hub จริง · ในเครื่อง: http://localhost:3000
core_hub_web_url: https://csmju2030.jowave.com   # เว็บที่ /auth/login ส่งเบราว์เซอร์ไป · ในเครื่อง: http://localhost:3100
callback_path: /auth/callback         # base_url + callback_path ต้องตรงกับ Callback URL ที่ลงทะเบียนไว้

# endpoint ที่เรียกได้โดยไม่มี token (SSO 1.1)
public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

probes:
  collection: /api/v1/class-sections
  not_found: /api/v1/class-sections/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/class-sections/not-a-uuid
  create:
    path: /api/v1/class-sections
    allowed_role: staff
    denied_role: guest                # ต้องได้ 403 และมีบัญชีรหัสผ่าน · guest ไม่ได้ map ในระบบนี้
    invalid_body:
      courseCode: nope
      latitude: 999
    valid_body:
      courseCode: CS777
      courseName: Conformance Probe
      sectionCode: "1"
      academicYear: 2026
      term: 1
      latitude: 18.8925
      longitude: 99.0142

# component ในข้อ 7.1 ที่ template กลาง (csmju/) ยังไม่มี — ประกอบเองจาก class ใน csmju/ui.ts + token
# (ui-design-system.md 17.0) · อยู่ที่ frontend/src/components/shared/kit/
local_components:
  - Button
  - Card
  - StatCard
  - Alert
  - EmptyState
  - ErrorState
  - Skeleton
  - FormField
  - TextInput
  - Select
  - Checkbox
  - DescriptionList
  - Pagination
  - RoleBadge
  - formatDate

owners:
  pl: "@csmju2030/pl-attendance-checker"
  aie: "@csmju2030/aie-attendance-checker"

display_name: "Attendance Checker"
repo: github.com/CSMJU2030/csmju-attendance-checker
status: proposed
